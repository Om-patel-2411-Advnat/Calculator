<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.tailwindcss.com"></script>
  <title>Calculator UI</title>
</head>
<body class="min-h-screen flex items-center justify-center bg-gray-100">

  <div class="relative w-80 bg-white rounded-xl shadow-lg p-4">
    
    <!-- Toggle Button -->
    <button
      id="toggleBtn"
      class="absolute top-3 right-3 text-xs px-3 py-1 rounded-full bg-gray-900 text-white">
      Scientific
    </button>

    <!-- Display -->
    <div class="mb-4">
      <input
        type="text"
        placeholder="0"
        class="w-full text-right text-2xl p-3 border rounded-lg outline-none"
        disabled
      />
    </div>
    
    <!-- Simple Calculator -->
    <div id="simpleCalc" class="grid grid-cols-4 gap-3">
      <button class="btn">7</button>
      <button class="btn">8</button>
      <button class="btn">9</button>
      <button class="btn">÷</button>

      <button class="btn">4</button>
      <button class="btn">5</button>
      <button class="btn">6</button>
      <button class="btn">×</button>

      <button class="btn">1</button>
      <button class="btn">2</button>
      <button class="btn">3</button>
      <button class="btn">−</button>

      <button class="btn col-span-2">0</button>
      <button class="btn">.</button>
      <button class="btn">+</button>

      <button class="btn col-span-4 bg-gray-900 text-white">=</button>
    </div>

    <!-- Scientific Calculator -->
    <div id="scientificCalc" class="hidden grid grid-cols-4 gap-3 mt-3">
      <button class="btn">sin</button>
      <button class="btn">cos</button>
      <button class="btn">tan</button>
      <button class="btn">π</button>

      <button class="btn">log</button>
      <button class="btn">ln</button>
      <button class="btn">x²</button>
      <button class="btn">√</button>
    </div>
  </div>

  <script>
    const toggleBtn = document.getElementById("toggleBtn");
    const simpleCalc = document.getElementById("simpleCalc");
    const scientificCalc = document.getElementById("scientificCalc");

    let isScientific = false;

    toggleBtn.addEventListener("click", () => {
      isScientific = !isScientific;

      scientificCalc.classList.toggle("hidden", !isScientific);
      toggleBtn.textContent = isScientific ? "Simple" : "Scientific";
    });
  </script>

  <script>
    // Tailwind reusable button style
    document.querySelectorAll(".btn").forEach(btn => {
      btn.classList.add(
        "p-3",
        "rounded-lg",
        "bg-gray-200",
        "hover:bg-gray-300",
        "text-center",
        "font-medium"
      );
    });
  </script>

</body>
</html>
